name: Generate Contribution Snake
on:
  schedule:
    # 每6小时自动刷新贪吃蛇
    - cron: "0 */6 * * *"
  # 支持手动执行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@master
        with:
          github_user_name: lifany-jia
          output_svg_path: github-contribution-grid-snake.svg
          palette: github-dark

      - name: Push image to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
